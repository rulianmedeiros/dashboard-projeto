services:
  backend:
    build: ./backend
    container_name: dashboard-backend
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=file:./prisma/dev.db

  frontend:
    build: ./frontend
    container_name: dashboard-frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    # ESTA LINHA É O SEGREDO: Abre o sinal para o Nginx
    command: npm run dev -- --host 0.0.0.0