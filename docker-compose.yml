services:
  backend:
    build: ./backend
    container_name: dashboard-backend
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: dashboard-frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    # O comando --host é vital para o Nginx conseguir ler o site
    command: npm run dev -- --host 0.0.0.0