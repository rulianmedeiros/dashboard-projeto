services:
  backend:
    build: ./backend
    container_name: dashboard-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=file:./prisma/dev.db

  frontend:
    build: ./frontend
    container_name: dashboard-frontend
    restart: always
    ports:
      - "5173:5173"
    # O comando abaixo é o que mata o erro de conexão recusada
    command: npm run dev -- --host 0.0.0.0