services:
  backend:
    build: ./backend
    container_name: dashboard-backend
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=file:./prisma/dev.db
    # Garante que o backend aceite conexões externas
    command: npm start

  frontend:
    build: ./frontend
    container_name: dashboard-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    # O comando --host 0.0.0.0 resolve o erro ERR_CONNECTION_REFUSED
    command: npm run dev -- --host 0.0.0.0