services:
  backend:
    build: ./backend
    container_name: dashboard-backend
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=file:./prisma/dev.db

  frontend:
    build: ./frontend
    container_name: dashboard-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app