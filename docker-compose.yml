services:
  backend:
    build: ./backend
    container_name: dashboard-backend
    restart: always
    ports:
      - "8082:3001"
    environment:
      - DATABASE_URL=file:./prisma/dev.db

  frontend:
    build: ./frontend
    container_name: dashboard-frontend
    restart: always
    ports:
      - "8081:80"
    # O comando --host 0.0.0.0 garante que o sinal saia do container para a VPS
    command: npm run dev -- --host 0.0.0.0